name: Build AL QURAN

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Locate Android SDK
        run: |
          for p in $ANDROID_HOME /usr/local/lib/android/sdk /opt/android-sdk $HOME/android-sdk; do
            if [ -d "$p/platforms" ]; then
              echo "Using SDK: $p"
              echo "ANDROID_HOME=$p" >> $GITHUB_ENV
              echo "sdk.dir=$p" > local.properties
              cat local.properties
              exit 0
            fi
          done
          echo "No Android SDK found" && exit 1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Clean build (forces real compile)
        run: ./gradlew clean :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: Verify APK exists
        run: |
          echo "=== Outputs dir ==="
          find app/build/outputs -name "*.apk" -exec ls -la {} \; || (echo "NO APK PRODUCED"; tail -100 /tmp/gradle.log; exit 1)
          APK=$(find app/build/outputs -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "No APK found — printing full gradle log"
            tail -150 /tmp/gradle.log
            exit 1
          fi
          echo "Found APK: $APK"
          ls -lh "$APK"
          echo "APK_SIZE=$(stat -c%s "$APK")" >> $GITHUB_ENV

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: al-quran-debug-apk
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: /tmp/gradle.log
          retention-days: 7
