name: Build AL QURAN

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Detect Android SDK path
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          if [ -z "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME not set — locating..."
            for p in /usr/local/lib/android/sdk /opt/android-sdk /usr/lib/android-sdk $HOME/android-sdk; do
              if [ -d "$p" ]; then
                echo "Found SDK at $p"
                echo "ANDROID_HOME=$p" >> $GITHUB_ENV
                echo "ANDROID_SDK_ROOT=$p" >> $GITHUB_ENV
                echo "sdk.dir=$p" > local.properties
                break
              fi
            done
          else
            echo "sdk.dir=$ANDROID_HOME" > local.properties
          fi
          cat local.properties

      - name: List installed SDK components
        run: |
          ls $ANDROID_HOME/platforms/ 2>&1 || true
          ls $ANDROID_HOME/build-tools/ 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --info 2>&1 | tail -80

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: al-quran-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: app/build/reports/ 2>/dev/null || true
          retention-days: 7
          if-no-files-found: ignore
